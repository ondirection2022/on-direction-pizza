<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ON DIRECTION | لوحة التحكم</title><style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap');:root{--bg:#120f0e;--panel:#221c19;--red:#ed4536;--yellow:#ffcc53;--muted:#c0b2a7}*{box-sizing:border-box}body{margin:0;font-family:Cairo,system-ui,sans-serif;background:var(--bg);color:#fff5e9}header{background:#1d1714;border-bottom:1px solid #ffffff22;padding:16px 5%;display:flex;align-items:center;justify-content:space-between;gap:10px}a{color:var(--yellow)}.brand{font:900 22px Arial;direction:ltr}.brand span{color:var(--red)}main{width:min(1050px,94%);margin:38px auto}h1{font-size:clamp(24px,4vw,36px)}p,small{color:var(--muted)}.panel{background:var(--panel);border:1px solid #ffffff1b;border-radius:18px;padding:24px;margin:20px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.full{grid-column:1/-1}label{display:block;font-weight:700;font-size:13px;margin:7px 0}input,select,textarea{width:100%;background:#100e0d;border:1px solid #ffffff4a;color:white;padding:11px 13px;border-radius:9px;font:inherit}textarea{min-height:80px}input[type=checkbox]{width:auto;accent-color:var(--red)}.btn{background:var(--red);border:0;padding:11px 18px;color:white;border-radius:10px;font:800 14px Cairo;cursor:pointer}.btn.secondary{background:#55483f}.btn.warn{background:#9d342f}.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.item{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#1b1613;border:1px solid #ffffff1a;padding:12px;border-radius:12px;margin:10px 0}.item img{width:70px;height:70px;object-fit:cover;border-radius:9px}.item .info{flex:1;min-width:0}.item .info strong{display:block}.item .actions{display:flex;gap:6px;flex-wrap:wrap}.tag{border-radius:20px;background:#563327;padding:3px 9px;font-size:11px}#message{border-radius:9px;min-height:32px;font-size:13px;margin:12px 0}#message:not(:empty){padding:8px 12px;background:#342920}#login{max-width:480px;margin:70px auto}#workspace{display:none}#preview{width:120px;height:90px;object-fit:cover;border-radius:9px;display:none;margin:8px 0}button:disabled{opacity:.5;cursor:not-allowed}@media(max-width:640px){.grid{grid-template-columns:1fr}.item{align-items:flex-start;flex-wrap:wrap}.item .actions{width:100%}.panel{padding:15px}}
</style></head><body><header><div class="brand">ON <span>DIRECTION</span></div><a href="./index.html">← عرض الموقع</a></header><main><div id="message" role="status"></div><section id="login" class="panel"><h1>🔐 دخول الإدارة</h1><p>الحسابات المعتمدة فقط تقدر تغيّر المنيو.</p><form id="loginForm"><label for="email">الإيميل</label><input id="email" type="email" required autocomplete="username"><label for="password">كلمة المرور</label><input id="password" type="password" required autocomplete="current-password"><br><br><button class="btn" type="submit">دخول</button></form></section><section id="workspace"><div class="bar"><div><h1>🍕 إدارة المنيو</h1><p id="who"></p></div><button id="logout" class="btn secondary">تسجيل خروج</button></div><section class="panel"><h2 id="formTitle">إضافة صنف جديد</h2><form id="productForm" class="grid"><div><label for="name">اسم الصنف *</label><input id="name" maxlength="90" required></div><div><label for="price">السعر بالجنيه *</label><input id="price" type="number" min="0" max="100000" step="0.01" required></div><div><label for="category">القسم</label><select id="category"><option value="pizza">🍕 بيتزا</option><option value="sides">🍟 إضافات</option><option value="drinks">🥤 مشروبات</option></select></div><div><label for="emoji">رمز بديل للصورة</label><input id="emoji" maxlength="8" value="🍕"></div><div class="full"><label for="desc">الوصف</label><textarea id="desc" maxlength="350"></textarea></div><div class="full"><label for="image">صورة الصنف (JPG / PNG / WebP حتى 10 ميجابايت)</label><input id="image" type="file" accept="image/jpeg,image/png,image/webp"><img id="preview" alt="معاينة"><small>هيتم تصغير الصورة وضغطها تلقائيًا قبل الحفظ. لو ما رفعتش صورة جديدة، القديمة هتفضل موجودة.</small></div><div class="full"><label><input id="available" type="checkbox" checked> الصنف متاح للزبائن</label></div><div class="full bar"><div><button class="btn" type="submit" id="saveBtn">حفظ الصنف</button> <button class="btn secondary" type="button" id="resetBtn">إلغاء / صنف جديد</button></div><label><input type="checkbox" id="removeImage"> حذف صورة الصنف الحالية</label></div></form></section><section class="panel"><div class="bar"><h2>الأصناف الموجودة</h2><span id="count"></span></div><div id="items">جاري التحميل...</div></section></section></main><script type="module" src="./admin.js"></script></body></html>
